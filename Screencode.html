<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<!-- Pixel Font -->
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: 'VT323', monospace;
        color: #00ff99;
    }

    #screen {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        overflow: hidden;
    }

    #text {
        white-space: nowrap;
        font-size: 22px;
        padding-left: 100%;
        animation: scroll 10s linear infinite;
    }

    @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
    }
</style>
</head>

<body>
<div id="screen">
    <div id="text">NOW PLAYING</div>
</div>

<script>
    function setText(newText) {
        const el = document.getElementById("text");
        el.textContent = newText;
        el.style.animation = "none";
        el.offsetHeight; // reset animation
        el.style.animation = "scroll 10s linear infinite";
    }
</script>
</body>
</html>
